[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "propulpy"
dynamic = ["version"]
description = "Rocket motor design and inverse-design library, built to complement RocketPy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "UltraLuminics - Universidad Nacional de Colombia" }]
keywords = ["rocketry", "propulsion", "solid rocket motor", "internal ballistics", "nozzle", "rocketpy", "optimization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "rocketpy>=1.8",
]

[project.optional-dependencies]
cad = ["cadquery>=2.4"]
optim = ["pymoo>=0.6"]
cantera = ["cantera>=3.0"]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "pre-commit>=3.5", "pyyaml>=6.0"]
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.15", "myst-parser>=2", "numpydoc>=1.6"]

[project.urls]
Homepage = "https://github.com/UltraLuminics/PropulPy"
Issues = "https://github.com/UltraLuminics/PropulPy/issues"

[tool.hatch.version]
path = "propulpy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["propulpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["notebooks/legacy", "docs/conf.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "NPY", "D"]
ignore = ["D102", "D105", "D107", "D301", "D401", "E501", "N802", "N803", "N806", "N815", "N816"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]
